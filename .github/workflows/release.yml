name: Build and Release

on:
  push:
    tags:
      - 'v*'   # 仅当推送以 v 开头的 tag 时触发，例如 v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  # gh release upload 要求 Release 已存在，先统一创建，各构建 job 只负责上传
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 需要 checkout 才能读取 RELEASE_NOTES.md
          GH_REPO: ${{ github.repository }}
        # 仓库根目录的 RELEASE_NOTES.md 是当版发布文案（随版本号一起提交）；
        # 首次创建或已存在时都写入该文案，缺失则回退到自动生成的说明。
        # 重跑工作流即可刷新已有 Release 的正文。
        run: |
          TAG=${{ github.ref_name }}
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md 2>/dev/null \
              || gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null \
              || gh release view "$TAG" > /dev/null
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 开放神州的 g2p 数据（62MB）不进本仓库，同步脚本默认读取同级 ../OpenShenzhou；
      # CI workspace 是 .../ListextEditor/ListextEditor，因此克隆到 ../OpenShenzhou 即默认路径
      - name: Fetch OpenShenzhou data
        run: git clone --depth 1 https://github.com/XiaoYangTech/OpenShenzhou.git ../OpenShenzhou
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win:x64
      # Windows 安装包必须声明 requireAdministrator（UAC 管理员权限）：
      # nsis.perMachine=true 时 electron-builder 会给安装包加管理员清单；
      # 同时校验 onnxruntime 已按平台裁剪，防止打包配置回退导致体积/权限静默变坏。
      - name: Verify installer UAC and pruned onnxruntime
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem dist -Filter '*Setup*.exe' -File)
          if ($exes.Count -ne 1) { throw "dist 下应恰好有 1 个 Setup.exe，实际 $($exes.Count) 个" }
          $exe = $exes[0]
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try {
            $buffer = New-Object byte[] (8MB)
            $read = $stream.Read($buffer, 0, $buffer.Length)
            $text = [System.Text.Encoding]::ASCII.GetString($buffer, 0, $read)
          } finally {
            $stream.Close()
          }
          if (-not $text.Contains('requireAdministrator')) {
            throw "安装包未声明 requireAdministrator（UAC 管理员权限）：$($exe.Name)"
          }
          $unpacked = (Resolve-Path 'dist\win-unpacked').Path
          $onnxDir = Join-Path $unpacked 'resources\app.asar.unpacked\node_modules\onnxruntime-node'
          if (-not (Test-Path $onnxDir)) { throw "未找到 onnxruntime-node 解包目录：$onnxDir" }
          $onnxBytes = (Get-ChildItem $onnxDir -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $onnxMiB = [math]::Round($onnxBytes / 1MB, 1)
          if ($onnxBytes -gt 120MB) { throw "onnxruntime 未按平台裁剪：$onnxMiB MiB（预期约 66MiB）" }
          $platformDirs = @(Get-ChildItem (Join-Path $onnxDir 'bin\napi-v6') -Directory | Select-Object -ExpandProperty Name)
          if ($platformDirs.Count -ne 1 -or $platformDirs[0] -ne 'win32') {
            throw "onnxruntime 仍包含多余平台目录：$($platformDirs -join ',')"
          }
          Write-Host "OK: $($exe.Name) 声明 requireAdministrator；onnxruntime 已裁剪至 $onnxMiB MiB（仅 win32/x64）"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.exe --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      # onnxruntime-node 的 postinstall 在 linux/x64 上默认从 nuget 下载 CUDA EP（解压后约 272MB），
      # 本项目只用默认 CPU EP；跳过下载可让每个 Linux 安装包少 200MB+，
      # 其余平台的推理库由 scripts/after-pack.js 在打包后按目标平台裁剪。
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      # 开放神州的 g2p 数据（62MB）不进本仓库，同步脚本默认读取同级 ../OpenShenzhou；
      # CI workspace 是 .../ListextEditor/ListextEditor，因此克隆到 ../OpenShenzhou 即默认路径
      - name: Fetch OpenShenzhou data
        run: git clone --depth 1 https://github.com/XiaoYangTech/OpenShenzhou.git ../OpenShenzhou
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ffmpeg-static 按安装时架构下载二进制：npm ci 已在 x64 runner 上装了 x64 版，
      # 而 install.js 检测到同名文件已存在会直接 exit(0) 不下载，
      # 必须先删掉旧二进制才能强制重新下载 arm64 版
      - name: Reinstall ffmpeg-static for arm64
        if: matrix.arch == 'arm64'
        run: |
          cd node_modules/ffmpeg-static
          rm -f ffmpeg ffmpeg.README ffmpeg.LICENSE
          npm_config_arch=arm64 npm_config_platform=linux node install.js
          file ffmpeg
          file ffmpeg | grep -qi aarch64 || { echo "::error::ffmpeg 仍非 arm64 二进制"; exit 1; }
      - name: Install ARM64 tools (if needed)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install fpm (for .deb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm
      - name: Build for Linux ${{ matrix.arch }}
        run: npm run build:linux:${{ matrix.arch }}
      # 校验 afterPack 的平台裁剪确实生效：每个 Linux 包只留本平台/架构的 onnxruntime，
      # 且不含 CUDA/TensorRT EP 组件（本项目只用 CPU EP）。
      - name: Verify pruned onnxruntime and package size
        run: |
          set -e
          ONNX_DIR=$(find dist -type d -path '*app.asar.unpacked/node_modules/onnxruntime-node' | head -n 1)
          [ -n "$ONNX_DIR" ] || { echo "::error::未找到 onnxruntime-node 解包目录"; exit 1; }
          SIZE_MB=$(du -sm "$ONNX_DIR" | cut -f1)
          echo "onnxruntime 目录：$ONNX_DIR （${SIZE_MB}MB）"
          [ "$SIZE_MB" -lt 120 ] || { echo "::error::onnxruntime 未按平台裁剪（${SIZE_MB}MB）"; exit 1; }
          PLATFORM_DIRS=$(ls "$ONNX_DIR/bin/napi-v6")
          [ "$PLATFORM_DIRS" = "linux" ] || { echo "::error::onnxruntime 仍含其它平台目录：$PLATFORM_DIRS"; exit 1; }
          ARCH_DIRS=$(ls "$ONNX_DIR/bin/napi-v6/linux")
          [ "$ARCH_DIRS" = "${{ matrix.arch }}" ] || { echo "::error::onnxruntime 架构不对：$ARCH_DIRS"; exit 1; }
          if ls "$ONNX_DIR"/bin/napi-v6/linux/*/libonnxruntime_providers_* >/dev/null 2>&1; then
            echo "::error::CUDA/TensorRT EP 组件仍在包内"; exit 1
          fi
          echo "OK: onnxruntime 仅保留 linux/${{ matrix.arch }}，无 CUDA EP"
          echo "--- 安装包体积 ---"
          du -h dist/*.AppImage dist/*.deb
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*.AppImage dist/*.deb; do
            [ -f "$file" ] && gh release upload ${{ github.ref_name }} "$file" --clobber
          done

  # 只出 Apple Silicon 包（arm64），不再提供 Intel 版
  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # 开放神州的 g2p 数据（62MB）不进本仓库，同步脚本默认读取同级 ../OpenShenzhou；
      # CI workspace 是 .../ListextEditor/ListextEditor，因此克隆到 ../OpenShenzhou 即默认路径
      - name: Fetch OpenShenzhou data
        run: git clone --depth 1 https://github.com/XiaoYangTech/OpenShenzhou.git ../OpenShenzhou
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:mac:arm64
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.dmg --clobber

  # 三个平台全部传完 GitHub 后，用 CNB 官方 gsync 工具同步 Release 到 CNB：
  # 先 create 建 Release，再 download 拉回附件、逐文件 upload（一次整批上传会被 CNB
  # 限制导致附件同步不全，故单文件上传并带重试）
  # 注意：CNB 仓库路径与 GitHub 不同（InspireWorks/ListextEditor）
  sync-cnb:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      # gsync 官方仓库已无二进制 release，install.sh 失效，改为源码构建（ubuntu 镜像自带 Go）
      - name: Install gsync (build from source)
        run: |
          git clone --depth 1 https://cnb.cool/5.5/CNB/sync/gsync.git /tmp/gsync-src
          cd /tmp/gsync-src
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/gsync" .
          "$HOME/.local/bin/gsync" --help | head -5
      - name: Create CNB Release (skip if exists)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          gsync releases create \
            --source-repo https://cnb.cool/InspireWorks/ListextEditor.git \
            --source-username cnb \
            --source-token "$CNB_TOKEN" \
            --tags ${{ github.ref_name }}
      - name: Sync Release + attachments to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          TAG=${{ github.ref_name }}
          DL_DIR=/tmp/release-assets
          rm -rf "$DL_DIR" && mkdir -p "$DL_DIR" && cd "$DL_DIR"
          # 先把 GitHub Release 的附件整体下载到本地
          gsync releases download \
            --source-repo https://github.com/XiaoYangTech/ListextEditor.git \
            --source-username github-actions \
            --source-token "$GITHUB_TOKEN" \
            --tag "$TAG"
          # 逐文件上传到 CNB：一次一批会被 CNB 限制导致同步不全，单文件上传并失败重试 3 次
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) | while read -r f; do
            n=0
            until gsync releases upload \
              --target-repo https://cnb.cool/InspireWorks/ListextEditor.git \
              --target-username cnb \
              --target-token "$CNB_TOKEN" \
              --tag "$TAG" \
              --files "$f"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "::error::上传 $f 到 CNB 失败（已重试 3 次）"
                exit 1
              fi
              echo "上传 $f 失败，10 秒后重试（第 $n 次）"
              sleep 10
            done
          done
      # gsync 只在创建 Release 时写入描述，Release 已存在时不会更新，
      # 所以标题/正文单独走 CNB API（PATCH /-/releases/{id}）同步
      - name: Sync Release description to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # 本 job 不 checkout，gh 需要显式指定仓库
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=${{ github.ref_name }}
          INFO=$(gh release view "$TAG" --json name,body)
          # 注意：CNB API 必须带 Accept: application/json，否则一律 406
          RID=$(curl -sf -H "Authorization: token $CNB_TOKEN" -H "Accept: application/json" \
            "https://api.cnb.cool/InspireWorks/ListextEditor/-/releases/tags/$TAG" | jq -r .id)
          echo "$INFO" | jq -c '{name: .name, body: .body}' | curl -sf -X PATCH \
            -H "Authorization: token $CNB_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" \
            --data-binary @- \
            "https://api.cnb.cool/InspireWorks/ListextEditor/-/releases/$RID"
          echo "CNB Release 标题与正文已同步"
