name: Build and Release

on:
  push:
    tags:
      - 'v*'   # 仅当推送以 v 开头的 tag 时触发，例如 v1.0.0

permissions:
  contents: write
  packages: write

jobs:
  # gh release upload 要求 Release 已存在，先统一创建，各构建 job 只负责上传
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes || true

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win:x64
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.exe --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ARM64 tools (if needed)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install fpm (for .deb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm
      - name: Build for Linux ${{ matrix.arch }}
        run: npm run build:linux:${{ matrix.arch }}
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in dist/*.AppImage dist/*.deb; do
            [ -f "$file" ] && gh release upload ${{ github.ref_name }} "$file" --clobber
          done

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/*.dmg --clobber

  # 三个平台全部传完 GitHub 后，用 CNB 官方 gsync 工具把整条 Release（元数据+附件）
  # 一次性同步到 CNB，避免手写 CNB 两段式上传 API（asset-upload-url + PUT + confirm）
  # 注意：CNB 仓库路径与 GitHub 不同（InspireWorks/ListextEditor）
  sync-cnb:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Install gsync
        run: |
          curl -sSL https://cnb.cool/zhiqiangwang/gsync/-/git/raw/main/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          gsync --version
      - name: Create CNB Release (skip if exists)
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          gsync releases create \
            --source-repo https://cnb.cool/InspireWorks/ListextEditor.git \
            --source-token "$CNB_TOKEN" \
            --tags ${{ github.ref_name }}
      - name: Sync Release + attachments to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          gsync releases sync \
            --source-repo https://github.com/XiaoYangTech/ListextEditor.git \
            --source-token "$GITHUB_TOKEN" \
            --target-repo https://cnb.cool/InspireWorks/ListextEditor.git \
            --target-token "$CNB_TOKEN" \
            --tags ${{ github.ref_name }}
